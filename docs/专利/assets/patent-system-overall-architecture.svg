<text x="715.0" y="635" text-anchor="middle" class="body">同义词/别名表</text>
<text x="715.0" y="658" text-anchor="middle" class="body">实体属性映射表</text>
<path d="M890,577 C890,561 1095,561 1095,577 L1095,673 C1095,689 890,689 890,673 Z" class="box"/>
<ellipse cx="992.5" cy="577" rx="102.5" ry="12" class="box"/>
<text x="992.5" y="608" text-anchor="middle" class="module">参数策略仓</text>
<text x="992.5" y="635" text-anchor="middle" class="body">通用规则 + 工具覆盖</text>
<text x="992.5" y="658" text-anchor="middle" class="body">格式转换 policy</text>
<rect x="1200" y="270" width="175" height="170" rx="9" class="box"/>
<text x="1287.5" y="302" text-anchor="middle" class="module">工具执行模块</text>
<text x="1287.5" y="332" text-anchor="middle" class="body">端侧工具</text>
<text x="1287.5" y="357" text-anchor="middle" class="body">云端 API / 第三方工具</text>
<text x="1287.5" y="382" text-anchor="middle" class="body">仅接收最终真值</text>
<path d="M233 192 H315" class="arrow"/>
<text x="274" y="177" text-anchor="middle" class="label">用户意图 / 设备上下文</text>
<circle cx="274" cy="211" r="13" class="number"/>
<text x="274" y="216" text-anchor="middle" class="num">1</text>
<path d="M535 195 H600" class="arrow"/>
<text x="568" y="178" text-anchor="middle" class="label">模型上下文</text>
<circle cx="568" cy="211" r="13" class="number"/>
<text x="568" y="216" text-anchor="middle" class="num">2</text>
<path d="M805 195 H870" class="arrow"/>
<text x="838" y="178" text-anchor="middle" class="label">含引用的工具调用</text>
<circle cx="838" cy="211" r="13" class="number"/>
<text x="838" y="216" text-anchor="middle" class="num">3</text>
<path d="M982 260 V315" class="arrow"/>
<text x="1040" y="294" text-anchor="middle" class="label">进入 pre-call 流水线</text>
<circle cx="982" cy="287" r="13" class="number"/>
<text x="982" y="292" text-anchor="middle" class="num">4</text>
<path d="M515 402 H540" class="arrow"/>
<path d="M690 402 H715" class="arrow"/>
<path d="M865 402 H890" class="arrow"/>
<path d="M430 565 V510 H615 V450" class="data"/>
<text x="500" y="535" text-anchor="middle" class="label">结果引用数据源</text>
<path d="M715 565 V510 H645 V450" class="data"/>
<text x="725" y="535" text-anchor="middle" class="label">语义引用数据源</text>
<path d="M992 565 V450" class="data"/>
<text x="1060" y="525" text-anchor="middle" class="label">转换/校验规则</text>
<path d="M1045 402 H1200" class="arrow"/>
<text x="1122" y="385" text-anchor="middle" class="label">最终真值参数</text>
<circle cx="1122" cy="418" r="13" class="number"/>
<text x="1122" y="423" text-anchor="middle" class="num">5</text>
<path d="M1287 440 V730 H430 V685" class="return"/>
<text x="875" y="757" text-anchor="middle" class="label">工具结果默认写入工作记忆</text>
<circle cx="1165" cy="730" r="13" class="number"/>
<text x="1165" y="735" text-anchor="middle" class="num">6</text>
<path d="M430 565 V520 H425 V260" class="return"/>
<text x="330" y="520" text-anchor="middle" class="label">结果/掩码后上下文回流</text>
<path d="M967 450 V520 H1165 V520" class="return"/>
<text x="1060" y="545" text-anchor="middle" class="label">失败：返回明确错误，不调工具</text>
<rect x="35" y="782" width="1330" height="48" rx="7" class="box"/>
<text x="62" y="812" text-anchor="start" class="label">图例：</text>
<text x="125" y="812" text-anchor="start" class="note">实线箭头=主调用流；短虚线=数据/策略读取；长虚线=结果或错误回流；工具实现无需识别引用协议。</text>
</svg>