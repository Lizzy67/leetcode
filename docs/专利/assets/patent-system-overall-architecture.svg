<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
<style>
      .box{fill:#fff;stroke:#000;stroke-width:2.1}
      .runtime{fill:#fff;stroke:#000;stroke-width:2.2;stroke-dasharray:11 7}
      .pipeline{fill:#fff;stroke:#000;stroke-width:2.5}
      .arrow{fill:none;stroke:#000;stroke-width:2.1;marker-end:url(#arrowhead)}
      .return{fill:none;stroke:#000;stroke-width:2.1;stroke-dasharray:8 6;marker-end:url(#arrowhead)}
      .data{fill:none;stroke:#000;stroke-width:1.9;stroke-dasharray:3 4;marker-end:url(#arrowhead)}
      .title{font:700 27px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}
      .subtitle{font:14px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}
      .module{font:700 18px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}
      .body{font:14px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}
      .label{font:700 13px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}
      .note{font:14px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}
      .num{font:700 14px Arial,sans-serif;fill:#000}
      .number{fill:#fff;stroke:#000;stroke-width:1.8}
    </style>
</defs>
<rect width="1400" height="850" fill="#fff"/>
<text x="700" y="38" text-anchor="middle" class="title">图2  本发明系统总体架构示意图</text>
<text x="700" y="65" text-anchor="middle" class="subtitle">模型只表达引用意图；调度层在工具执行前求值、转换、校验并回填真值</text>
<rect x="28" y="130" width="205" height="125" rx="9" class="box"/>
<text x="130.5" y="162" text-anchor="middle" class="module">用户终端</text>
<text x="130.5" y="192" text-anchor="middle" class="body">手机 / 电视 / 车机</text>
<text x="130.5" y="217" text-anchor="middle" class="body">用户请求 + 设备状态</text>
<rect x="275" y="88" width="870" height="650" rx="15" class="runtime"/>
<rect x="310" y="74" width="235" height="31" fill="#fff"/>
<text x="427" y="96" text-anchor="middle" class="module">智能体运行系统</text>
<rect x="315" y="130" width="220" height="130" rx="9" class="box"/>
