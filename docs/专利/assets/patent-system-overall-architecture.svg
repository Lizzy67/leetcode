<text x="702.5" y="192" text-anchor="middle" class="body">理解意图</text>
<text x="702.5" y="217" text-anchor="middle" class="body">输出含 ${…} 的 tool call</text>
<rect x="870" y="130" width="225" height="130" rx="9" class="box"/>
<text x="982.5" y="162" text-anchor="middle" class="module">工具调度模块</text>
<text x="982.5" y="192" text-anchor="middle" class="body">接收工具名与参数</text>
<text x="982.5" y="217" text-anchor="middle" class="body">统一调度入口</text>
<rect x="330" y="315" width="750" height="175" rx="12" class="pipeline"/>
<rect x="365" y="301" width="245" height="31" fill="#fff"/>
<text x="487" y="323" text-anchor="middle" class="module">调用前参数处理流水线</text>
<rect x="365" y="355" width="150" height="95" rx="9" class="box"/>
<text x="440.0" y="387" text-anchor="middle" class="module">① 引用识别</text>
<text x="440.0" y="417" text-anchor="middle" class="body">扫描 ${…}</text>
