<text x="615.0" y="417" text-anchor="middle" class="body">查记忆/词典</text>
<text x="615.0" y="442" text-anchor="middle" class="body">回填业务真值</text>
<rect x="715" y="355" width="150" height="95" rx="9" class="box"/>
