<text x="967.5" y="417" text-anchor="middle" class="body">校验 schema</text>
<text x="967.5" y="442" text-anchor="middle" class="body">失败禁止透传</text>
<path d="M320,577 C320,561 540,561 540,577 L540,673 C540,689 320,689 320,673 Z" class="box"/>
<ellipse cx="430.0" cy="577" rx="110.0" ry="12" class="box"/>
<text x="430.0" y="608" text-anchor="middle" class="module">工作记忆</text>
<text x="430.0" y="635" text-anchor="middle" class="body">工具结果集</text>
<text x="430.0" y="658" text-anchor="middle" class="body">resultId → 字段真值</text>
<path d="M605,577 C605,561 825,561 825,577 L825,673 C825,689 605,689 605,673 Z" class="box"/>
<ellipse cx="715.0" cy="577" rx="110.0" ry="12" class="box"/>
