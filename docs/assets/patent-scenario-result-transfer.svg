<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
<style>.box{fill:#fff;stroke:#000;stroke-width:2}.dash{fill:#fff;stroke:#000;stroke-width:2;stroke-dasharray:8 6}.arr{fill:none;stroke:#000;stroke-width:2;marker-end:url(#a)}.ret{fill:none;stroke:#000;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#a)}.t{font:700 25px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}.h{font:700 18px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}.b{font:15px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}.s{font:13px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}</style>
</defs>
<rect width="1200" height="560" fill="#fff"/>
<text x="600" y="38" text-anchor="middle" class="t">图B  跨工具结果引用与送模掩码流程</text>
<text x="600" y="64" text-anchor="middle" class="s">模型不需读取或复述长 URI，执行前从工作记忆回填</text>
<rect x="50" y="115" width="190" height="120" rx="8" class="box"/>
<text x="145.0" y="147" text-anchor="middle" class="h">工具 A</text>
<text x="145.0" y="177" text-anchor="middle" class="b">上传/生成文件</text>
<text x="145.0" y="202" text-anchor="middle" class="b">返回长 fileUri</text>
<rect x="305" y="100" width="245" height="150" rx="8" class="box"/>
<text x="427.5" y="132" text-anchor="middle" class="h">工作记忆</text>
<text x="427.5" y="162" text-anchor="middle" class="b">默认写入工具结果</text>
<text x="427.5" y="187" text-anchor="middle" class="b">分配 resultId</text>
<text x="427.5" y="212" text-anchor="middle" class="b">保存 resultId→结果</text>
<rect x="615" y="115" width="210" height="120" rx="8" class="box"/>
<text x="720.0" y="147" text-anchor="middle" class="h">大语言模型</text>
<text x="720.0" y="177" text-anchor="middle" class="b">看到引用而非 URI</text>
<text x="720.0" y="202" text-anchor="middle" class="b">原样写入下游参数</text>
<rect x="890" y="100" width="255" height="150" rx="8" class="box"/>
<text x="1017.5" y="132" text-anchor="middle" class="h">调度/引用解析</text>
<text x="1017.5" y="162" text-anchor="middle" class="b">识别 ${resultId.fileUri}</text>
<text x="1017.5" y="187" text-anchor="middle" class="b">查工作记忆</text>
<text x="1017.5" y="212" text-anchor="middle" class="b">回填真实 URI</text>
<path d="M240 175 L305 175" class="arr"/>
<text x="272.5" y="165" text-anchor="middle" class="s">① 结果入库</text>
<path d="M550 175 L615 175" class="arr"/>
<text x="582.5" y="165" text-anchor="middle" class="s">② 送模前 mask</text>
<path d="M825 175 L890 175" class="arr"/>
<text x="857.5" y="165" text-anchor="middle" class="s">③ 工具 B 入参引用</text>
<rect x="890" y="365" width="255" height="110" rx="8" class="box"/>
<text x="1017.5" y="397" text-anchor="middle" class="h">工具 B</text>
<text x="1017.5" y="427" text-anchor="middle" class="b">接收真实 fileUri</text>
<text x="1017.5" y="452" text-anchor="middle" class="b">工具实现零改动</text>
<path d="M1017 250 L1017 365" class="arr"/>
<text x="1017.0" y="240" text-anchor="middle" class="s">④ 回填后调用</text>
<rect x="305" y="365" width="245" height="110" rx="8" class="box"/>
<text x="427.5" y="397" text-anchor="middle" class="h">掩码后的上下文</text>
<text x="427.5" y="427" text-anchor="middle" class="b">fileUri =</text>
<text x="427.5" y="452" text-anchor="middle" class="b">${a1b2c3d4.fileUri}</text>
<path d="M427 250 L427 365" class="ret"/>
<text x="427.0" y="240" text-anchor="middle" class="s">所见即所填</text>
<text x="600" y="525" text-anchor="middle" class="b">技术效果：降低长值拉回上下文及模型抄写导致的 token、时延和截断/改写风险。</text>
</svg>