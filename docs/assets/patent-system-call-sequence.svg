<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
<marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#000" stroke-width="1.5"/></marker>
<style>
      .box{fill:#fff;stroke:#000;stroke-width:2}
      .life{fill:none;stroke:#000;stroke-width:1.6;stroke-dasharray:7 6}
      .msg{fill:none;stroke:#000;stroke-width:1.9;marker-end:url(#a)}
      .ret{fill:none;stroke:#000;stroke-width:1.7;stroke-dasharray:7 5;marker-end:url(#open)}
      .act{fill:#fff;stroke:#000;stroke-width:1.6}
      .frame{fill:#fff;stroke:#000;stroke-width:2}
      .divider{fill:none;stroke:#000;stroke-width:1.5;stroke-dasharray:6 5}
      .title{font:700 27px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}
      .subtitle{font:14px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}
      .actor{font:700 17px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}
      .body{font:14px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}
      .small{font:12px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}
      .label{font:13px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}
      .frameLabel{font:700 14px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}
    </style>
</defs>
<rect width="1600" height="960" fill="#fff"/>
<text x="800" y="36" text-anchor="middle" class="title">图3  本发明工具调用参数引用解析时序图</text>
<text x="800" y="62" text-anchor="middle" class="subtitle">主路径：引用识别与求值 → 可选策略转换 → 校验回填 → 工具执行 → 结果入库</text>
<rect x="0.0" y="82" width="180" height="70" rx="7" class="box"/>
<text x="90" y="113" text-anchor="middle" class="actor">用户终端</text>
<text x="90" y="137" text-anchor="middle" class="small">手机/电视/车机</text>
<path d="M90 152 V885" class="life"/>
<rect x="220.0" y="82" width="180" height="70" rx="7" class="box"/>
<text x="310" y="113" text-anchor="middle" class="actor">交互与上下文</text>
<text x="310" y="137" text-anchor="middle" class="small">智能体运行时</text>
<path d="M310 152 V885" class="life"/>
<rect x="440.0" y="82" width="180" height="70" rx="7" class="box"/>
<text x="530" y="113" text-anchor="middle" class="actor">大语言模型</text>
<text x="530" y="137" text-anchor="middle" class="small">意图与工具决策</text>
<path d="M530 152 V885" class="life"/>
<rect x="680.0" y="82" width="180" height="70" rx="7" class="box"/>
<text x="770" y="113" text-anchor="middle" class="actor">调度/引用拦截器</text>
<text x="770" y="137" text-anchor="middle" class="small">pre-call pipeline</text>
<path d="M770 152 V885" class="life"/>
<rect x="930.0" y="82" width="180" height="70" rx="7" class="box"/>
<text x="1020" y="113" text-anchor="middle" class="actor">可信数据源</text>
<text x="1020" y="137" text-anchor="middle" class="small">工作记忆/语义词典</text>
<path d="M1020 152 V885" class="life"/>
<rect x="1150.0" y="82" width="180" height="70" rx="7" class="box"/>
<text x="1240" y="113" text-anchor="middle" class="actor">参数策略仓</text>
<text x="1240" y="137" text-anchor="middle" class="small">transform/validate policy</text>
<path d="M1240 152 V885" class="life"/>
<rect x="1390.0" y="82" width="180" height="70" rx="7" class="box"/>
<text x="1480" y="113" text-anchor="middle" class="actor">工具执行模块</text>
<text x="1480" y="137" text-anchor="middle" class="small">端侧/云端工具</text>
<path d="M1480 152 V885" class="life"/>
<rect x="303" y="182" width="14" height="730" class="act"/>
<rect x="523" y="230" width="14" height="135" class="act"/>
<rect x="763" y="330" width="14" height="570" class="act"/>
<rect x="1473" y="655" width="14" height="95" class="act"/>
<path d="M90 195 H310" class="msg"/>
<text x="200.0" y="186" text-anchor="middle" class="label">① 提交用户意图及可选设备状态</text>
<path d="M310 245 H530" class="msg"/>
<text x="420.0" y="236" text-anchor="middle" class="label">② 发送上下文、Skill 及工具定义</text>
<path d="M530 295 H310" class="ret"/>
<text x="420.0" y="286" text-anchor="middle" class="label">③ 返回 tool call，参数中含 ${…} 引用</text>
<path d="M310 345 H770" class="msg"/>
<text x="540.0" y="336" text-anchor="middle" class="label">④ 进入统一工具调度入口</text>
<path d="M770 395 H1020" class="msg"/>
<text x="895.0" y="386" text-anchor="middle" class="label">⑤ 按引用类型查询结果字段或语义实体属性</text>
<path d="M1020 445 H770" class="ret"/>
<text x="895.0" y="436" text-anchor="middle" class="label">⑥ 返回唯一业务真值</text>
<path d="M770 495 H1240" class="msg"/>
<text x="1005.0" y="486" text-anchor="middle" class="label">⑦ 查询工具+参数绑定的转换/校验策略</text>
<path d="M1240 545 H770" class="ret"/>
<text x="1005.0" y="536" text-anchor="middle" class="label">⑧ 返回 policy（未配置时可跳过转换）</text>
<text x="770" y="585" text-anchor="middle" class="label">⑨ 拦截器对已展开真值执行可选格式转换，并校验最终 schema</text>
<rect x="690" y="600" width="860" height="205" class="frame"/>
<path d="M690 633 H1550" class="divider"/>
<path d="M690 710 H1550" class="divider"/>
<path d="M690 600 H805 L825 616 L805 633 H690 Z" class="box"/>
<text x="748" y="622" text-anchor="middle" class="frameLabel">alt</text>
<text x="845" y="624" text-anchor="start" class="frameLabel">解析、转换及校验成功</text>
<path d="M770 665 H1480" class="msg"/>
<text x="1125.0" y="656" text-anchor="middle" class="label">⑩ 回填最终真值参数并调用工具</text>
<path d="M1480 735 H770" class="ret"/>
<text x="1125.0" y="726" text-anchor="middle" class="label">⑪ 返回工具结果</text>
<text x="720" y="757" text-anchor="start" class="frameLabel">解析失败、映射歧义、转换失败或 schema 不合法</text>
<path d="M770 785 H310" class="ret"/>
<text x="540.0" y="776" text-anchor="middle" class="label">⑫ 短路：返回明确错误，禁止引用字面量或半成品参数透传</text>
<path d="M770 835 H1020" class="msg"/>
<text x="895.0" y="826" text-anchor="middle" class="label">⑬ 成功结果默认写入工作记忆</text>
<path d="M770 870 H310" class="ret"/>
<text x="540.0" y="861" text-anchor="middle" class="label">⑭ 返回工具结果或结构化错误</text>
<path d="M310 905 H90" class="ret"/>
<text x="200.0" y="896" text-anchor="middle" class="label">⑮ 返回业务结果，或引导用户/模型消歧重试</text>
<rect x="25" y="925" width="1550" height="25" fill="#fff"/>
<text x="800" y="945" text-anchor="middle" class="small">注：虚线箭头表示返回消息；成功主路径中工具只接收最终真值，对引用协议及参数转换过程无感知。</text>
</svg>