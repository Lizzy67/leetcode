<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
<style>.box{fill:#fff;stroke:#000;stroke-width:2}.dash{fill:#fff;stroke:#000;stroke-width:2;stroke-dasharray:8 6}.arr{fill:none;stroke:#000;stroke-width:2;marker-end:url(#a)}.ret{fill:none;stroke:#000;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#a)}.t{font:700 25px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}.h{font:700 18px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}.b{font:15px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}.s{font:13px WenQuanYi Micro Hei, Microsoft YaHei, PingFang SC, sans-serif;fill:#000}</style>
</defs>
<rect width="1200" height="560" fill="#fff"/>
<text x="600" y="38" text-anchor="middle" class="t">图C  引用展开后的入参策略化格式转换</text>
<text x="600" y="64" text-anchor="middle" class="s">先求值，再转换，最后校验并调用下游工具</text>
<rect x="40" y="120" width="235" height="140" rx="8" class="box"/>
<text x="157.5" y="152" text-anchor="middle" class="h">模型工具调用</text>
<text x="157.5" y="182" text-anchor="middle" class="b">images=&quot;${resultId.</text>
<text x="157.5" y="207" text-anchor="middle" class="b">merged_id_list}&quot;</text>
<text x="157.5" y="232" text-anchor="middle" class="b">不生成长对象数组</text>
<rect x="325" y="120" width="220" height="140" rx="8" class="box"/>
<text x="435.0" y="152" text-anchor="middle" class="h">引用求值单元</text>
<text x="435.0" y="182" text-anchor="middle" class="b">查询工作记忆</text>
<text x="435.0" y="207" text-anchor="middle" class="b">images=[563, 563, …]</text>
<rect x="595" y="105" width="260" height="170" rx="8" class="box"/>
<text x="725.0" y="137" text-anchor="middle" class="h">参数转换单元</text>
<text x="725.0" y="167" text-anchor="middle" class="b">读取工具+参数 policy</text>
<text x="725.0" y="192" text-anchor="middle" class="b">逐元素 map</text>
<text x="725.0" y="217" text-anchor="middle" class="b">封装 {&quot;file_id&quot;: string(item)}</text>
<rect x="905" y="120" width="250" height="140" rx="8" class="box"/>
<text x="1030.0" y="152" text-anchor="middle" class="h">参数校验与工具 B</text>
<text x="1030.0" y="182" text-anchor="middle" class="b">校验对象列表 schema</text>
<text x="1030.0" y="207" text-anchor="middle" class="b">成功后调用</text>
<text x="1030.0" y="232" text-anchor="middle" class="b">失败则短路</text>
<path d="M275 190 L325 190" class="arr"/>
<text x="300.0" y="180" text-anchor="middle" class="s">① resolve</text>
<path d="M545 190 L595 190" class="arr"/>
<text x="570.0" y="180" text-anchor="middle" class="s">② transform</text>
<path d="M855 190 L905 190" class="arr"/>
<text x="880.0" y="180" text-anchor="middle" class="s">③ validate/invoke</text>
<rect x="330" y="365" width="540" height="105" rx="8" class="box"/>
<text x="600.0" y="397" text-anchor="middle" class="h">转换后的最终参数</text>
<text x="600.0" y="427" text-anchor="middle" class="b">images=[{&quot;file_id&quot;:&quot;563&quot;},</text>
<text x="600.0" y="452" text-anchor="middle" class="b">{&quot;file_id&quot;:&quot;563&quot;}, …]</text>
<path d="M725 275 L650 365" class="arr"/>
<text x="687.5" y="265" text-anchor="middle" class="s">输出最终结构</text>
<text x="600" y="525" text-anchor="middle" class="b">技术效果：上下游 schema 解耦；模型无需改写长 JSON；工具 A/B 的接口与实现均可保持不变。</text>
</svg>